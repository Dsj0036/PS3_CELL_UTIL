# package.conf - configuración básica para PKG homebrew de prueba

# ID de contenido único, formato: EP0000-[REGION]XXXXX_00-[NAME]
CONTENT_ID=EP0000-BLES12345_00-EXPERIMENTAL0000

# Nombre que aparecerá en el XMB
TITLE=TestHomebrew

PackageVersion=01.00
Klicensee = 00 11 22 33 44 55 66 77 88 99 AA BB CC DD EE FF

# Versión del título, 4 bytes hex
VERSION=00010000

# Vendor ID de desarrollador (hex, 4 bytes)
VENDOR_ID=10011324

# Tipo de aplicación, para homebrew suele ser EXEC o similar
APP_TYPE=EXEC

# Permite lanzamiento desde el XMB
IS_LAUNCHABLE=1

# ID del firmware mínimo requerido (ejemplo 4.84)
MIN_FW=0004008400000000
